workflows:
  default-workflow:
    name: Default Workflow
    environment:
      flutter: stable
    scripts:
      - name: Create Android folder
        script: |
          flutter create --platforms=android .
      - name: Get packages
        script: |
          flutter pub get
      - name: Build AAB and APK
        script: |
          flutter build appbundle --release
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
